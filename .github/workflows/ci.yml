name: CI

on:
  push:
    branches: [ main, cuda-backend ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # CPU build + test across platforms
  # ---------------------------------------------------------------------------
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential ccache

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install cmake ccache

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install ccache -y --no-progress

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-${{ matrix.build_type }}

    - name: Configure CMake
      # bash shell so '\' continuations and $(...) work on Windows too
      # (PowerShell does not support '\' line continuation)
      shell: bash
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DBOAT_WITH_TESTS=ON \
          -DBOAT_WITH_EXAMPLES=ON \
          -DBOAT_WITH_HUGGINGFACE=ON \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      shell: bash
      run: |
        cd build
        cmake --build . --config ${{ matrix.build_type }} -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

    - name: Run tests
      shell: bash
      run: |
        cd build
        ctest --output-on-failure -C ${{ matrix.build_type }} -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

  # ---------------------------------------------------------------------------
  # Code coverage (Linux only, gcovr + Codecov)
  # ---------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential gcovr

    - name: Configure CMake (coverage)
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DBOAT_WITH_TESTS=ON \
          -DBOAT_WITH_EXAMPLES=ON \
          -DBOAT_WITH_HUGGINGFACE=ON \
          -DBOAT_WITH_COVERAGE=ON \
          -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: |
        cd build
        cmake --build . --config Debug -j$(nproc)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure -C Debug -j$(nproc)

    - name: Generate coverage report
      run: |
        # Run from the repo root: gcovr resolves --filter relative to the
        # CWD, so 'cd build && gcovr --root ..' matches nothing (empty report).
        gcovr --root build \
              --filter 'src/' \
              --filter 'include/' \
              --exclude 'tests/' \
              --exclude 'examples/' \
              --xml build/coverage.xml \
              --html build/coverage.html \
              --html-details \
              --print-summary

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: build/coverage.xml
        fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Memory safety gate (Linux only): the whole CPU test suite under valgrind.
  # Uses scripts/valgrind_sweep.sh so the exact command set can be reproduced
  # locally (e.g. the WSL2 workflow).
  # ---------------------------------------------------------------------------
  memcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential valgrind

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DBOAT_WITH_TESTS=ON \
          -DBOAT_WITH_EXAMPLES=ON \
          -DBOAT_WITH_HUGGINGFACE=ON \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

    - name: Build
      run: |
        cd build
        cmake --build . -j$(nproc)

    - name: Run tests (regular ctest)
      run: |
        cd build
        ctest --output-on-failure -j$(nproc)

    - name: Run valgrind sweep
      run: |
        bash scripts/valgrind_sweep.sh build

  # ---------------------------------------------------------------------------
  # Encoding hygiene (UTF-8 without BOM, no mojibake)
  # ---------------------------------------------------------------------------
  encoding:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check file encoding
      run: python3 scripts/check_encoding.py
